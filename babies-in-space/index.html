<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Малыши в космосе</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0a2e;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(11,10,46,.55);cursor:pointer;transition:opacity .5s}
  #start.hide{opacity:0;pointer-events:none}
  #play{width:min(34vmin,220px);height:min(34vmin,220px);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9a8,#ffb84d 60%,#ff8a3d);
    border:8px solid #fff;box-shadow:0 0 60px rgba(255,200,100,.6);
    display:flex;align-items:center;justify-content:center;animation:pulse 1.4s ease-in-out infinite}
  #play::after{content:"";margin-left:12%;border-style:solid;border-color:transparent transparent transparent #fff;
    border-width:calc(min(34vmin,220px)*.18) 0 calc(min(34vmin,220px)*.18) calc(min(34vmin,220px)*.3)}
  @keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><div id="play"></div></div>
<script>
'use strict';
// ============================================================
//  МАЛЫШИ В КОСМОСЕ — живая 2D-сцена (Canvas + WebAudio)
//  Основные механики:
//   1) Тап по малышу — смеётся, кувыркается, сердечки
//   2) Тап по пустому космосу — появляется игрушка, малыш летит её ловить
//   3) Кнопка-ракета — с планеты взлетает новый малыш
//  Мини-интеракции: звёзды-колокольчики, падающие звёзды, планета с лицом
//  и инопланетянином, планета с кольцами меняет цвет, режим «спать» с
//  колыбельной, искорки за курсором, малыши следят глазами и машут,
//  луч у НЛО, малыш на луне просыпается.
// ============================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
let W = 0, H = 0, DPR = 1, S = 1, BR = 26;
let t = 0;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const easeOutBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const pointer = { x: -9999, y: -9999, lastSpark: 0 };
let night = 0, nightTarget = 0, soundOn = true, started = false;

// ---------------- ЗВУК ----------------
let AC = null, master = null;
function initAudio() {
  if (!AC || AC.state === 'closed') {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
  }
  if (AC.state !== 'running') AC.resume().catch(() => {});
}
// браузер может «усыпить» звук, когда вкладка скрыта, — будим при возвращении
document.addEventListener('visibilitychange', () => { if (!document.hidden && started) initAudio(); });
addEventListener('focus', () => { if (started) initAudio(); });
function tone(f, dur, o = {}) {
  try { tone0(f, dur, o); } catch (e) { console.warn('tone', e); }
}
function tone0(f, dur, o) {
  if (!AC || !soundOn || !isFinite(f) || !isFinite(dur)) return;
  if (AC.state !== 'running') AC.resume().catch(() => {});
  const t0 = o.at != null ? o.at : AC.currentTime + (o.delay || 0);
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
  const v = o.vol || 0.2;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function whoosh(dur = 0.9, vol = 0.22) {
  if (!AC || !soundOn) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  const t0 = AC.currentTime;
  f.frequency.setValueAtTime(250, t0); f.frequency.exponentialRampToValueAtTime(2200, t0 + dur * 0.7);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
const sfx = {
  giggle(p = 1) { for (let i = 0; i < 6; i++) { const f = rand(650, 900) * p; tone(f, 0.1, { type: 'triangle', vol: 0.16, slide: f * 1.35, delay: i * 0.09 }); } },
  pop() { tone(280, 0.16, { slide: 950, vol: 0.25 }); },
  chime(f) { tone(f, 1.4, { vol: 0.14 }); tone(f * 2, 0.9, { type: 'triangle', vol: 0.04 }); },
  yay() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, { type: 'triangle', vol: 0.13, delay: i * 0.08 })); },
  boing() { tone(110, 0.55, { slide: 440, vol: 0.28 }); },
  boop() { tone(300, 0.12, { slide: 200, vol: 0.15 }); },
  sparkle() { [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.5, { vol: 0.07, delay: i * 0.05 })); },
  beam() { tone(400, 1.0, { type: 'sine', slide: 1200, vol: 0.12 }); tone(410, 1.0, { type: 'sine', slide: 1210, vol: 0.08 }); },
};
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];
// Колыбельная «Twinkle twinkle» (народная мелодия)
const MEL = [[0,1],[0,1],[7,1],[7,1],[9,1],[9,1],[7,2],[5,1],[5,1],[4,1],[4,1],[2,1],[2,1],[0,2],[null,2]];
let lulI = 0, lulNext = 0;
function updLullaby() {
  if (!AC || !soundOn || nightTarget < 1) { lulNext = 0; lulI = 0; return; }
  const now = AC.currentTime;
  if (lulNext < now) lulNext = now + 0.4;
  while (lulNext < now + 0.3) {
    const [n, len] = MEL[lulI], dur = len * 0.55;
    if (n !== null) {
      const f = 523.25 * Math.pow(2, n / 12);
      tone(f, dur * 1.7, { vol: 0.07, at: lulNext, attack: 0.04 });
      tone(f / 2, dur * 1.9, { type: 'triangle', vol: 0.035, at: lulNext, attack: 0.04 });
    }
    lulNext += dur; lulI = (lulI + 1) % MEL.length;
  }
}

// ---------------- РИСОВАЛКИ ----------------
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }
function starPath(n, ro, ri) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? ri : ro, a = i * Math.PI / n - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
}
function heartPath(s) {
  ctx.beginPath(); ctx.moveTo(0, s * 0.35);
  ctx.bezierCurveTo(-s * 1.1, -s * 0.35, -s * 0.45, -s * 1.05, 0, -s * 0.45);
  ctx.bezierCurveTo(s * 0.45, -s * 1.05, s * 1.1, -s * 0.35, 0, s * 0.35);
  ctx.fill();
}

// ---------------- МИР ----------------
const planet = { x: 0, y: 0, r: 100, wob: 0, blink: 0, blinkT: 3, laugh: 0, alienT: 0, alienAng: -Math.PI / 2, tapN: 0, wink: 0, fount: 0, hop: 0 };
const ringed = { x: 0, y: 0, r: 30, hue: 28, spinT: 0 };
const btn = {
  launch: { x: 0, y: 0, r: 40, press: 0, shake: 0 },
  night:  { x: 0, y: 0, r: 40, press: 0, shake: 0 },
  house:  { x: 0, y: 0, r: 40, press: 0, shake: 0 },
  sound:  { x: 0, y: 0, r: 22, press: 0, shake: 0 },
};
const smallStars = Array.from({ length: 180 }, () => ({ fx: Math.random(), fy: Math.random(), s: rand(0.4, 1.7), ph: rand(0, TAU), sp: rand(0.8, 3) }));
const bigStars = [];
(function makeBigStars() {
  let guard = 0;
  while (bigStars.length < 9 && guard++ < 500) {
    const fx = rand(0.05, 0.95), fy = rand(0.06, 0.78);
    if (Math.hypot(fx - 0.5, (fy - 0.56) * 0.8) < 0.26) continue;
    if (Math.hypot(fx - 0.13, fy - 0.2) < 0.1) continue;
    if (bigStars.some(s => Math.hypot(s.fx - fx, s.fy - fy) < 0.14)) continue;
    bigStars.push({ fx, fy, x: 0, y: 0, ph: rand(0, TAU), pop: 0, note: PENTA[bigStars.length % PENTA.length] });
  }
})();
const nebulae = [[0.18, 0.28, '255,120,200'], [0.82, 0.22, '120,200,255'], [0.72, 0.88, '180,120,255'], [0.12, 0.82, '100,255,200']];
const bgC = document.createElement('canvas');
function buildBg() {
  bgC.width = W * DPR; bgC.height = H * DPR;
  const b = bgC.getContext('2d'); b.setTransform(DPR, 0, 0, DPR, 0, 0);
  const M = Math.max(W, H);
  let g = b.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, M * 0.85);
  g.addColorStop(0, '#3b2b80'); g.addColorStop(0.5, '#211a5e'); g.addColorStop(1, '#0c0b30');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  for (const [fx, fy, c] of nebulae) {
    g = b.createRadialGradient(W * fx, H * fy, 0, W * fx, H * fy, M * 0.35);
    g.addColorStop(0, `rgba(${c},0.22)`); g.addColorStop(1, `rgba(${c},0)`);
    b.fillStyle = g; b.fillRect(0, 0, W, H);
  }
}

const particles = [];
function addP(p) { p.max = p.life; particles.push(p); if (particles.length > 600) particles.shift(); }
function burst(x, y, kind, n, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(o.min || 40, o.speed || 160) * S;
    addP({ kind, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + (o.up || 0) * S, life: rand(0.7, o.life || 1.4),
      size: rand(0.7, 1.3) * (o.size || 10) * S, color: o.color || pick(['#ff7aa8', '#ffd66b', '#8fd3ff', '#a8e6a1', '#c9a7ff']),
      rot: rand(0, TAU), vr: rand(-6, 6), g: o.g || 0 });
  }
}

// ---------------- МАЛЫШИ ----------------
const SKINS = ['#ffdcbf', '#f6c7a0', '#e5ad7f', '#c98d62', '#ffe6d1'];
const ONESIES = ['#ff9ec7', '#8fd3ff', '#ffd66b', '#a8e6a1', '#c9a7ff', '#ffb38a'];
const HAIRS = ['#6b4226', '#2b1d14', '#e8c26a', '#b5562b'];
const babies = [];
class Baby {
  constructor(type, x, y) {
    Object.assign(this, { type, x, y, vx: 0, vy: 0 });
    this.skin = pick(SKINS); this.color = pick(ONESIES); this.hair = pick(HAIRS);
    this.spin = 0; this.spinLeft = 0; this.bounce = 0; this.laugh = 0; this.happy = 0; this.awake = 0;
    this.blink = 0; this.blinkT = rand(1, 4); this.zT = rand(0, 2); this.trailT = 0; this.beamT = 0; this.rockT = 0;
    this.wx = x; this.wy = y; this.wTimer = rand(0, 2); this.phase = rand(0, TAU); this.face = 1;
    this.target = null; this.toy = null; this.born = -10;
    // жизнь внутри дома
    this.home = null; this.dragged = false; this.crib = null;
    this.ix = 0; this.iy = 0; this.iwx = 0; this.iwy = 0; this.iwT = 0; this.ifall = false; this.ivy = 0; this.ifloor = 0;
    // анимации по тапу, желания, игра, еда
    this.tapN = 0; this.anim = null; this.love = 0; this.wish = null; this.wishT = rand(8, 30);
    this.chair = null; this.play = null; this.eat = null; this.eatPending = false;
  }
  hitR() { return BR * ({ rocket: 2.3, ufo: 2.4, bubble: 2.2, moon: 2.7, suit: 2.0 }[this.type]); }
  sleeping() {
    if (this.dragged || this.love > 0 || this.eat || this.eatPending || this.play) return false;
    if (this.home) return (this.crib || !this.home.room.light) && this.awake <= 0 && this.laugh <= 0;
    return (night > 0.5 || this.type === 'moon') && this.awake <= 0 && this.laugh <= 0;
  }
  visible() { return scene === 'space' ? !this.home : this.home === curHouse; }
  tick(dt) {
    this.laugh = Math.max(0, this.laugh - dt); this.happy = Math.max(0, this.happy - dt);
    this.awake = Math.max(0, this.awake - dt); this.bounce = Math.max(0, this.bounce - dt * 1.6);
    this.beamT = Math.max(0, this.beamT - dt); this.rockT = Math.max(0, this.rockT - dt);
    this.blinkT -= dt; if (this.blinkT <= 0) { this.blink = 0.15; this.blinkT = rand(2, 5); }
    this.blink = Math.max(0, this.blink - dt);
    this.love = Math.max(0, this.love - dt);
    if (this.anim) { this.anim.t -= dt; if (this.anim.t <= 0) this.anim = null; }
    if (this.eat) {
      const E = this.eat; E.t -= dt; E.nomT -= dt;
      if (E.nomT <= 0 && E.t > 0.2) {
        E.nomT = 0.32;
        if (this.visible()) { sfx.nom(); const [hx, hy] = roomHead(this); burst(hx, hy + RB() * 0.6, 'confetti', 2, { size: 4, speed: 60, g: 400, color: pick(['#f3c98b', '#fff1c9', '#ffb38a']) }); }
      }
      if (E.t <= 0) {
        this.eat = null;
        if (this.visible()) sfx.yum();
        if (!satisfy(this, 'eat')) { this.laugh = 1; this.bounce = 1; if (this.visible()) { const [hx, hy] = roomHead(this); burst(hx, hy, 'heart', 5, { size: 8, speed: 100, up: -60, color: '#ff7aa8' }); } }
      }
    }
    if (this.spinLeft > 0) { const st = Math.min(this.spinLeft, dt * 9); this.spin += st; this.spinLeft -= st; if (this.spinLeft <= 0) this.spin = 0; }
    if (this.sleeping() && this.visible()) {
      this.zT -= dt;
      if (this.zT <= 0) {
        this.zT = rand(1.4, 2.4);
        const [zx, zy] = this.home ? [this.ix + BR, this.iy - BR * 3.2] : [this.x + BR, this.y - BR * 1.5];
        addP({ kind: 'z', x: zx, y: zy, vx: 18 * S, vy: -28 * S, life: 2.2, size: rand(14, 20) * S, color: '#e6e0ff', rot: 0, vr: 0, g: 0 });
      }
    }
  }
  // жизнь в комнате: ползает по полу, спит в кроватке
  updateIn(dt) {
    this.tick(dt);
    if (this.dragged) return;
    const h = this.home, L = LAY(h);
    if (this.crib) { const c = L.cribs[this.crib.i]; this.ix = c.x - L.cw * 0.18; this.iy = c.y - 38 * S; return; }
    if (this.chair) { const c = L.chairs[this.chair.i]; this.ix = c.x; this.iy = c.y; return; }
    if (this.ifall) {
      this.ivy += 1500 * S * dt; this.iy += this.ivy * dt;
      if (this.iy >= this.ifloor) { this.iy = this.ifloor; this.ifall = false; this.bounce = 1; if (this.visible()) sfx.boop(); }
      return;
    }
    if (this.play) { updatePlay(this, dt, L); return; }
    if (this.eat || this.eatPending) return;
    this.iwT -= dt;
    if (this.iwT <= 0) {
      this.iwx = rand(L.bx0, L.bx1); this.iwy = rand(L.by0, L.by1); this.iwT = rand(3, 7);
      // сам иногда ползёт поиграть с большой игрушкой (если ничего не просит)
      if (h.kind !== 'canteen' && !this.wish && this.visible() && !this.sleeping() && Math.random() < 0.3) {
        const free = TOYS4.filter(k => !toyBusy(h, k)); if (free.length) this.play = { k: pick(free), phase: 'go', t: 9 };
      }
    }
    if (this.sleeping()) return;
    const dx = this.iwx - this.ix, dy = this.iwy - this.iy, d = Math.hypot(dx, dy);
    if (d > 3) { const sp = Math.min(38 * S, d) * dt; this.ix += dx / d * sp; this.iy += dy / d * sp; if (Math.abs(dx) > 2) this.face = Math.sign(dx); }
  }
  update(dt) {
    this.tick(dt);
    if (this.dragged) { this.vx = this.vy = 0; return; }
    const sleep = this.sleeping();
    if (this.target && (this.target.held || this.target.dead)) this.target = null;
    this.wTimer -= dt;
    if (this.wTimer <= 0) { [this.wx, this.wy] = wanderPoint(this); this.wTimer = this.type === 'rocket' ? rand(1.8, 3.2) : rand(4, 8); }
    let tx = this.wx, ty = this.wy, max;
    if (this.target) { tx = this.target.x; ty = this.target.y; max = 330 * S; }
    else max = ({ rocket: 230, moon: 16, ufo: 55 }[this.type] || 42) * S * (sleep ? 0.35 : 1);
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(max, d * 1.2);
    const k = this.target ? 3 : this.type === 'rocket' ? 1.3 : 0.8;
    this.vx += (dx / d * sp - this.vx) * Math.min(1, dt * k);
    this.vy += (dy / d * sp - this.vy) * Math.min(1, dt * k);
    // не врезаться в планету
    const px = this.x - planet.x, py = this.y - planet.y, pd = Math.hypot(px, py) || 1, minD = planet.r + this.hitR() * 0.8;
    if (pd < minD) { const f = (minD - pd) * 10 * dt; this.vx += px / pd * f * 10; this.vy += py / pd * f * 10; }
    // мягкие границы экрана
    const m = this.hitR();
    if (this.x < m) this.vx += (m - this.x) * 6 * dt; if (this.x > W - m) this.vx -= (this.x - W + m) * 6 * dt;
    if (this.y < m) this.vy += (m - this.y) * 6 * dt; if (this.y > H - m) this.vy -= (this.y - H + m) * 6 * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (Math.abs(this.vx) > 8 * S) this.face = Math.sign(this.vx);
    if (this.type === 'rocket' && scene === 'space') {
      this.trailT -= dt;
      if (this.trailT <= 0) {
        this.trailT = 0.035;
        const tilt = this.tilt(), back = BR * 2.3;
        const tx2 = this.x - this.face * Math.cos(tilt) * back, ty2 = this.y - Math.sin(tilt) * back;
        addP({ kind: Math.random() < 0.5 ? 'smoke' : 'spark', x: tx2, y: ty2, vx: -this.vx * 0.2 + rand(-15, 15) * S, vy: -this.vy * 0.2 + rand(-15, 15) * S,
          life: rand(0.5, 0.9), size: rand(5, 9) * S, color: pick(['#ffd66b', '#ff9a5a', '#fff']), rot: 0, vr: 0, g: 0 });
      }
    }
    // поймал игрушку?
    if (this.target && dist(this.x, this.y, this.target.x, this.target.y) < BR * 1.8) {
      const toy = this.target; toy.held = this; this.toy = toy; this.target = null;
      this.happy = 4; this.laugh = 1.2; this.bounce = 1; this.awake = 5;
      if (scene === 'space') { sfx.yay(); burst(this.x, this.y, 'heart', 7, { size: 9, speed: 120, up: -60, color: '#ff7aa8' }); }
      satisfy(this, 'play');
    }
  }
  tilt() { return clamp(Math.atan2(this.vy, Math.abs(this.vx) + 1), -0.6, 0.6); }
  draw() {
    const r = BR;
    const born = clamp((t - this.born) * 1.8, 0, 1), sc = born < 1 ? Math.max(0.01, easeOutBack(born)) : 1;
    const bob = Math.sin(t * 1.6 + this.phase) * 6 * S;
    const bnc = (1 + Math.sin(this.bounce * Math.PI * 3) * 0.22 * this.bounce) * (this.dragged ? 1.15 : 1);
    const sleep = this.sleeping();
    const mood = this.love > 0 ? 'love' : this.laugh > 0 || this.dragged ? 'laugh' : sleep ? 'sleep' : this.blink > 0 ? 'blink' : 'open';
    const look = { x: clamp((pointer.x - this.x) / (250 * S), -1, 1) * this.face, y: clamp((pointer.y - this.y) / (250 * S), -1, 1) };
    const near = dist(pointer.x, pointer.y, this.x, this.y) < 170 * S;
    let waveL, waveR;
    if (this.laugh > 0 || this.love > 0) { waveL = waveR = 1.9 + Math.sin(t * 14) * 0.3; }
    else if (!sleep && (this.happy > 0 || near)) { waveR = 1.7 + Math.sin(t * 11) * 0.5; waveL = 0.4; }
    else { waveL = 0.3 + Math.sin(t * 2 + this.phase) * 0.2; waveR = 0.3 + Math.sin(t * 2 + this.phase + 1) * 0.2; }

    if (h.o === 'launch') launchBaby();
    else if (h.o === 'house') {
      btn.house.press = 1;
      if (houses.length >= MAX_HOUSES) { btn.house.shake = 1; sfx.boop(); }
      else { picker.open = !picker.open; picker.t = 0; if (picker.open) { sfx.pop(); tone(660, 0.2, { type: 'triangle', vol: 0.1, delay: 0.08 }); } else sfx.boop(); }
    }
    else if (h.o === 'night') {
      btn.night.press = 1; nightTarget = nightTarget ? 0 : 1;
      if (nightTarget) { tone(660, 0.6, { vol: 0.12 }); tone(523, 0.9, { vol: 0.12, delay: 0.2 }); }
      else { sfx.yay(); for (const b of babies) if (!b.home) { b.awake = 0; b.laugh = 0.8; } }
    } else { btn.sound.press = 1; soundOn = !soundOn; if (soundOn) sfx.pop(); }
  } else if (h.k === 'house') enterRoom(h.o);
  else if (h.k === 'shoot') {
    const s = h.o; burst(s.x, s.y, 'spark', 26, { size: 9, speed: 260, color: '#fff3a0', g: 120 }); burst(s.x, s.y, 'confetti', 12, { speed: 200, g: 200 });
    sfx.sparkle(); s.life = 0;
  } else if (h.k === 'star') {
    const s = h.o; s.pop = 1; sfx.chime(s.note); burst(s.x, s.y, 'spark', 10, { size: 7, speed: 120, color: '#ffe27a' });
  } else if (h.k === 'ringed') {
    ringed.hue = (ringed.hue + rand(70, 140)) % 360; ringed.spinT = 1; sfx.boing(); burst(ringed.x, ringed.y, 'spark', 12, { size: 7, speed: 140, color: `hsl(${ringed.hue},90%,80%)` });
  } else if (h.k === 'pick') {
    picker.open = false; launchHouse(h.o);
  } else if (h.k === 'planet') tapPlanet();
}
// три разные реакции планеты — по кругу
function tapPlanet() {
  const P = planet, n = P.tapN++ % 3;
  if (n === 0) {
    P.wob = 1; P.laugh = 1.4; P.alienT = 2.6; P.alienAng = rand(-Math.PI * 0.8, -Math.PI * 0.2);
    sfx.giggle(0.55); setTimeout(() => tone(900, 0.15, { type: 'square', vol: 0.05, slide: 1300 }), 500);
  } else if (n === 1) {
    // подмигивает и пускает фонтан из звёздочек и сердечек
    P.wink = 1.8; P.fount = 1.3; P.wob = 0.4; P.laugh = 0;
    sfx.sparkle(); [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.3, { type: 'triangle', vol: 0.1, delay: 0.1 + i * 0.1 }));
  } else {
    // подпрыгивает, и вокруг разлетается кольцо сердечек
    P.hop = 1.2; P.laugh = 0; P.wink = 0; sfx.wheee(); setTimeout(() => sfx.boing(), 950);
    for (let i = 0; i < 18; i++) { const a = i / 18 * TAU; addP({ kind: 'heart', x: P.x + Math.cos(a) * P.r, y: P.y + Math.sin(a) * P.r, vx: Math.cos(a) * 160 * S, vy: Math.sin(a) * 160 * S, life: 1.5, size: 11 * S, color: pick(['#ff7aa8', '#ffd66b', '#8fd3ff', '#a8e6a1', '#c9a7ff']), rot: 0, vr: 0, g: 0 }); }
  }
}

// ---------------- ЦИКЛ ----------------
function layout() {
  planet.x = W / 2; planet.y = H * 0.56; planet.r = Math.min(W * 0.2, 135 * S);
  ringed.x = W * 0.13; ringed.y = H * 0.2; ringed.r = 34 * S;
  BR = 26 * S;
  const br = Math.max(38, 48 * S);
  Object.assign(btn.launch, { x: W - br - 24, y: H - br - 24, r: br });
  Object.assign(btn.house, { x: W - br * 3.4 - 24, y: H - br - 24, r: br });
  Object.assign(btn.night, { x: br + 24, y: H - br - 24, r: br });
  picker.opts.forEach((o, i) => Object.assign(o, { x: btn.house.x + (i ? 1 : -1) * br * 1.05, y: btn.house.y - br * 2.35, r0: br * 0.92 }));
  const sr = br * 0.55; Object.assign(btn.sound, { x: W - sr - 18, y: sr + 18, r: sr });
  for (const s of bigStars) { s.x = s.fx * W; s.y = s.fy * H; }
  for (const b of babies) {
    b.x = clamp(b.x, 0, W); b.y = clamp(b.y, 0, H); b.wTimer = 0;
    if (b.home) { const L = LAY(b.home); b.ix = clamp(b.ix, L.bx0, L.bx1); b.iy = clamp(b.iy, L.by0, L.by1); b.iwT = 0; }
  }
  for (const h of houses) { h.x = clamp(h.x, 0, W); h.y = clamp(h.y, 0, H); h.wTimer = 0; }
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H) / 720; layout(); buildBg();
}
function update(dt) {
  night += (nightTarget - night) * Math.min(1, dt * 1.2);
  for (const b of babies) { if (b.home) b.updateIn(dt); else b.update(dt); }
  const sb = babies.filter(b => !b.home && !b.dragged);
  for (let i = 0; i < sb.length; i++) for (let j = i + 1; j < sb.length; j++) {
    const a = sb[i], b = sb[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, m = (a.hitR() + b.hitR()) * 0.85;
    if (d < m) { const f = (m - d) * 3 * dt; a.x -= dx / d * f; a.y -= dy / d * f; b.x += dx / d * f; b.y += dy / d * f; }
  }
  for (const h of houses) h.update(dt);
  for (let i = 0; i < houses.length; i++) for (let j = i + 1; j < houses.length; j++) {
    const a = houses[i], b = houses[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, m = 190 * S;
    if (d < m) { const f = (m - d) * 2 * dt; a.x -= dx / d * f; a.y -= dy / d * f; b.x += dx / d * f; b.y += dy / d * f; }
  }
  updateToys(dt); updateShooting(dt);
  planet.wob = Math.max(0, planet.wob - dt * 1.2); planet.laugh = Math.max(0, planet.laugh - dt); planet.alienT = Math.max(0, planet.alienT - dt);
  planet.wink = Math.max(0, planet.wink - dt); planet.hop = Math.max(0, planet.hop - dt); planet.fount = Math.max(0, planet.fount - dt);
  if (planet.fount > 0 && scene === 'space') for (let i = 0; i < 2; i++) addP({ kind: Math.random() < 0.3 ? 'heart' : 'spark', x: planet.x + rand(-0.15, 0.15) * planet.r, y: planet.y - planet.r * 0.95,
    vx: rand(-150, 150) * S, vy: -rand(280, 460) * S, life: rand(1.2, 1.8), size: rand(7, 11) * S, color: `hsl(${(t * 300 + rand(0, 60)) % 360},90%,72%)`, rot: rand(0, TAU), vr: rand(-5, 5), g: 420 });
  updateWishes(dt);
  if (picker.open) { picker.t += dt; if (picker.t > 8) picker.open = false; }
  planet.blinkT -= dt; if (planet.blinkT <= 0) { planet.blink = 0.18; planet.blinkT = rand(2.5, 5); } planet.blink = Math.max(0, planet.blink - dt);
  ringed.spinT = Math.max(0, ringed.spinT - dt * 0.8);
  if (scene === 'room') {
    updateRoom(dt);
    // малыши в комнате не слипаются
    const rb = curHouse.occupants().filter(b => !b.dragged && !b.crib && !b.chair && !b.ifall && !(b.play && b.play.phase === 'do' && (b.play.k === 'horse' || b.play.k === 'xylo'))), Lr = LAY(curHouse), m = RB() * 1.9;
    for (let i = 0; i < rb.length; i++) for (let j = i + 1; j < rb.length; j++) {
      const a = rb[i], b = rb[j], dx = b.ix - a.ix, dy = (b.iy - a.iy) * 2, d = Math.hypot(dx, dy) || 1;
      if (d < m) { const f = (m - d) * 2 * dt; a.ix -= dx / d * f; b.ix += dx / d * f; a.iy -= dy / d * f * 0.5; b.iy += dy / d * f * 0.5; }
    }
    for (const b of rb) { b.ix = clamp(b.ix, Lr.door.x + Lr.door.w * 0.5, W - 30 * S); b.iy = clamp(b.iy, Lr.by0, Lr.by1); }
  }
  if (scene === 'space' && nightTarget && Math.random() < dt * 0.8) addP({ kind: 'note', x: planet.x + rand(-planet.r, planet.r) * 0.6, y: planet.y - planet.r * 0.9, vx: rand(-15, 15) * S, vy: -40 * S, life: 2.5, size: rand(16, 24) * S, color: pick(['#ffe27a', '#c9a7ff', '#8fd3ff']), rot: 0, vr: 0, g: 0 });
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * S * dt; p.rot += p.vr * dt; p.life -= dt; }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
  updLullaby(); updateTrans(dt);
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = a; ctx.fillStyle = p.color;
    if (p.kind === 'heart') { ctx.rotate(Math.sin(p.rot) * 0.3); heartPath(p.size); }
    else if (p.kind === 'spark') { ctx.rotate(p.rot); starPath(4, p.size, p.size * 0.35); ctx.fill(); }
    else if (p.kind === 'smoke') { ctx.globalAlpha = a * 0.45; circle(0, 0, p.size * (1 + (1 - a) * 1.5)); }
    else if (p.kind === 'bigheart') { const g = 1 + (1 - a) * 0.7; ctx.scale(g, g); heartPath(p.size); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * S; ctx.stroke(); }
    else if (p.kind === 'confetti') { ctx.rotate(p.rot); ctx.fillRect(-p.size * 0.5, -p.size * 0.25, p.size, p.size * 0.5); }
    else if (p.kind === 'z' || p.kind === 'note') { ctx.font = `bold ${p.size}px "Comic Sans MS", "Chalkboard SE", sans-serif`; ctx.textAlign = 'center'; ctx.fillText(p.kind === 'z' ? 'z' : (p.n || (p.n = pick(['♪', '♫']))), 0, 0); }
    ctx.restore();
  }
}
function draw() {
  if (scene === 'space') {
    ctx.drawImage(bgC, 0, 0, W, H);
    if (night > 0.01) { ctx.fillStyle = `rgba(5,3,25,${night * 0.45})`; ctx.fillRect(0, 0, W, H); }
    drawStars(); drawShooting(); drawRinged(); drawAlien(); drawPlanet();
    const hv = hoverTarget().house, wk = dragWish();
    for (const h of houses) h.draw(h === hv, wk && (wk === 'eat') === (h.kind === 'canteen'));
    for (const b of babies) if (!b.home && !b.dragged) b.draw();
    drawToys(); drawParticles();
    for (const b of babies) if (!b.home && b.dragged) b.draw();
    for (const b of babies) if (!b.home && b.wish) drawWish(b, ...wishPos(b));
    drawButton(btn.night, nightTarget ? '#ffb84d' : '#5b4bb7', iconMoonSun, false);
    drawButton(btn.house, '#2ec4b6', iconHouse, houses.length < MAX_HOUSES && !picker.open);
    if (picker.open) {
      const ap = easeOutBack(clamp(picker.t * 4, 0.01, 1));
      picker.opts.forEach(o => {
        o.r = o.r0 * Math.max(0.01, ap);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        for (let j = 1; j <= 2; j++) circle(btn.house.x + (o.x - btn.house.x) * j / 3.2, btn.house.y - btn.house.r * 0.9 + (o.y + o.r0 - btn.house.y + btn.house.r * 0.9) * j / 3.2, 5 * S * ap);
        drawButton(o, o.k === 'canteen' ? '#ff9f43' : '#2ec4b6', o.k === 'canteen' ? iconCanteen : iconNursery, true);
      });
    }
    drawButton(btn.launch, '#ff7aa8', iconRocket, babies.length < MAX_BABIES);
  } else {
    drawRoom(curHouse); drawParticles();
    for (const b of curHouse.occupants()) if (b.wish) drawWish(b, ...wishPos(b));
  }
  drawButton(btn.sound, scene === 'space' ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.25)', iconSound, false);
  drawTrans();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  update(dt); draw();
  if (pointer.moved) { pointer.moved = false; cv.style.cursor = drag && drag.moved ? 'grabbing' : (scene === 'space' ? hit : hitRoom)(pointer.x, pointer.y) ? 'pointer' : 'default'; }
  requestAnimationFrame(frame);
}

// ---------------- ВВОД ----------------
cv.addEventListener('pointerdown', e => {
  if (!started || trans) return;
  initAudio();
  const x = e.clientX, y = e.clientY; pointer.x = x; pointer.y = y;
  const h = scene === 'space' ? hit(x, y) : hitRoom(x, y);
  if (scene === 'space' && picker.open && !(h && (h.k === 'pick' || (h.k === 'btn' && (h.o === 'house' || h.o === 'sound'))))) { picker.open = false; sfx.boop(); return; }
  if (h && h.k === 'baby') { drag = { b: h.o, sx: x, sy: y, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} return; }
  if (scene === 'space') onTap(x, y, h); else onRoomTap(x, y, h);
});
cv.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.moved = true;
  if (drag) {
    if (!drag.moved && dist(e.clientX, e.clientY, drag.sx, drag.sy) > 10) { drag.moved = true; startDrag(drag.b); }
    if (drag.moved) moveDrag(drag.b, e.clientX, e.clientY);
  }
  if (started && performance.now() - pointer.lastSpark > 35) {
    pointer.lastSpark = performance.now();
    addP({ kind: 'spark', x: e.clientX + rand(-4, 4), y: e.clientY + rand(-4, 4), vx: rand(-20, 20) * S, vy: rand(10, 40) * S, life: rand(0.4, 0.8), size: rand(3, 6) * S, color: pick(['#fff', '#ffe27a', '#c9e8ff', '#ffc4e1']), rot: rand(0, TAU), vr: rand(-4, 4), g: 0 });
  }
});
function endDrag(e) {
  if (!drag) return;
  const { b, moved } = drag; drag = null;
  if (!moved) { if (scene === 'space') tapBaby(b); else tapRoomBaby(b); }
  else dropBaby(b, e.clientX, e.clientY);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { if (!drag) { pointer.x = -9999; pointer.y = -9999; } });
document.getElementById('start').addEventListener('pointerdown', () => {
  started = true; initAudio(); sfx.yay();
  document.getElementById('start').classList.add('hide');
});
addEventListener('resize', resize);

resize();
babies.push(
  new Baby('moon', W * 0.5, H * 0.14),
  new Baby('rocket', W * 0.2, H * 0.4),
  new Baby('suit', W * 0.8, H * 0.32),
  new Baby('suit', W * 0.32, H * 0.16),
  new Baby('ufo', W * 0.82, H * 0.72),
  new Baby('bubble', W * 0.18, H * 0.72),
);
requestAnimationFrame(frame);
</script>
</body>
