<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Сердечко-модница</title>
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mariia Play">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ffd6ea;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{position:fixed;inset:0;overscroll-behavior:none}
  canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;touch-action:none}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,190,220,.45);cursor:pointer;transition:opacity .5s}
  #start.hide{opacity:0;pointer-events:none}
  #play{width:min(34vmin,220px);height:min(34vmin,220px);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffd0e4,#ff7aa8 60%,#e8437a);
    border:8px solid #fff;box-shadow:0 0 60px rgba(255,120,170,.6);
    display:flex;align-items:center;justify-content:center;animation:pulse 1.4s ease-in-out infinite}
  #play::after{content:"";margin-left:12%;border-style:solid;border-color:transparent transparent transparent #fff;
    border-width:calc(min(34vmin,220px)*.18) 0 calc(min(34vmin,220px)*.18) calc(min(34vmin,220px)*.3)}
  @keyframes pulse{50%{transform:scale(1.08)}}
  /* «Домой» к витрине — только в приложении с домашнего экрана (там нет кнопки «назад» браузера) */
  #home{display:none;position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 8px);left:calc(env(safe-area-inset-left) + 8px);
    width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.35);align-items:center;justify-content:center}
  @media (display-mode: standalone){#home{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="home" href="../index.html" aria-label="домой"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z" fill="#fff"/></svg></a>
<div id="start"><div id="play"></div></div>
<script type="module" src="/src/scenes/heart-dress-up/main.ts"></script>
</body>
</html>
