<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mariia Play</title>
<link rel="icon" href="data:,">
<style>
  /* Витрина сцен: без текста, только большие картинки-кнопки (ребёнок не читает). */
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 40%,#3b2b80,#120c35);
    font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
  main{min-height:100vh;display:flex;flex-wrap:wrap;gap:5vmin;align-items:center;justify-content:center;padding:5vmin;box-sizing:border-box}
  a.scene{display:block;width:min(70vmin,420px);aspect-ratio:1;border-radius:50%;overflow:hidden;
    border:10px solid #fff;box-shadow:0 0 50px rgba(255,220,120,.55);animation:bob 2.4s ease-in-out infinite;
    background:#211a5e center/cover no-repeat}
  a.scene:hover,a.scene:active{transform:scale(1.06)}
  @keyframes bob{50%{transform:translateY(-12px) rotate(-2deg)}}
</style>
</head>
<body>
<main>
  <!-- Новая сцена = ещё одна ссылка с картинкой из public/thumbs -->
  <a class="scene" href="./babies-in-space/index.html" aria-label="Малыши в космосе"
     style="background-image:url(./thumbs/babies-in-space.png)"></a>
  <a class="scene" href="./heart-dress-up/index.html" aria-label="Сердечко-модница"
     style="background-image:url(./thumbs/heart-dress-up.png);animation-delay:-1.2s"></a>
</main>
</body>
</html>
